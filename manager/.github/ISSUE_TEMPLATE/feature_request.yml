name: 功能建议
description: 提出一个新功能或改进想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请重点说明**你想解决什么问题** —— 场景比方案更重要，
        有时同一个需求可以有更简单的实现方式。

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      description: 这个建议主要涉及哪部分？
      options:
        - 账号管理
        - 反代网关
        - 密钥管理
        - 请求日志 / 用量统计
        - 安全与 IP 管控
        - 设置 / 上游配置
        - 界面与交互体验
        - 部署与运维
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在遇到了什么不便？在什么场景下？
      placeholder: |
        例如：当账号数较多时，我无法一眼看出哪些账号积分即将耗尽……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？（可选，如果有具体想法）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否尝试过其他办法绕过这个问题？
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与计划中的功能（见 CHANGELOG「未发布」），确认没有重复
          required: true
